# config/conv.yaml
ConvConfig:
  # —— I/O —— #
  TOC_ENT_REL_NAME: "toc_with_entities_and_relations.json"
  CONV_RESULT_NAME: "conv_entities.json"

  # —— 邻域 —— #
  # 每个实体保留的共现邻居上限（按共同出现的小节数降序）
  MAX_NEIGHBORS_PER_ENTITY: 40

  # —— 定义补全（只用原文片段，不拿邻居描述编故事）—— #
  # missing: 只补没有定义的实体；all: 全部重写；none: 不调用 LLM
  ENRICH_MODE: "missing"
  ENRICH_MAX_ENTITIES: 100          # 单次构建最多补多少条，控制成本
  ENRICH_MIN_COVERAGE: 2            # 至少出现在 2 个小节才值得补
  MAX_DEFINITION_LEN: 300

  # —— LLM 调用参数（step 专属）—— #
  TEMPERATURE: 0.2
  MAX_TOKENS: 500
  DRY_RUN: false
  PROMPT_VERSION: "conv.v2"

  # —— 提示词模板 —— #
  # 占位符（string.Template 语法）：
  #   ${entity_name}  ${entity_type}  ${snippets}  ${occurrences}
  PROMPT_SYSTEM: |
    你是严谨的教材知识图谱编辑。你只能依据用户给出的原文片段写定义，
    不得引入片段之外的知识，不得使用“可能 / 通常 / 据说”等不确定措辞。

  PROMPT_USER_TEMPLATE: |
    目标实体：${entity_name}
    实体类型：${entity_type}
    出现位置：${occurrences}

    原文片段：
    ${snippets}

    请用一句中文给该实体下定义，要求：
    1. 只使用片段中明确陈述的信息，不要补充片段外的背景；
    2. 写成“X 是…… / X 指……”的完整定义句，长度 20–120 字；
    3. 如果片段不足以形成定义，返回空字符串，不要猜测；
    4. 不要输出 Markdown、引号或任何解释。

    输出严格 JSON（仅 JSON）：
    {"definition": "定义句或空字符串"}
