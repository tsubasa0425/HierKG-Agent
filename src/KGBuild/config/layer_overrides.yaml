# config/layer_overrides.yaml
# ---------------------------------------------------------------------------
# 人工分层覆写 —— 优先级：硬约束（待定→excluded） > 人工覆写 > 规则 > LLM/登记表
#
# 用途：业务方对分层有明确要求时，在这里钉死，不依赖规则或模型判断。
# 修改后下一次构建（aggr 及其后续步骤）自动生效；该文件会被记入 build_manifest
# 的 config_hashes，便于追溯。
#
# 字段：
#   name        必填，规范名（Conv 归并后的名称）
#   layer       必填，L1 / L2
#   type        可选，省略时匹配任意类型；填写时只匹配该类型
#   reason      可选，给业务方看的理由
#   owner       可选，责任人
#   updated_at  可选，最后修改日期
#
# 注意：类型为「待定」的节点不能靠覆写强行入图，请先修正抽取类型。
# ---------------------------------------------------------------------------

overrides: []

# 示例：
# overrides:
#   - name: "强化学习"
#     type: "学习方法"
#     layer: L1
#     reason: "教材核心概念，跨 3 个小节复用"
#     owner: "知识工程组"
#     updated_at: "2026-10-30"
#
#   - name: "GPT-4"
#     layer: L2
#     reason: "具体产品实例"
