# config/emb.yaml
# 向量嵌入阶段配置（Embedding.py）—— 用 Ollama 为 L1/L2 节点生成向量
EmbConfig:
  # —— I/O —— #
  INPUT_NAME: "aggr_entities.json"   # 只嵌入已分层的 L1/L2 节点
  OUTPUT_NAME: "node_embeddings.pkl" # {node_id: normalized_vector}

  # —— 模型 —— #
  # 留空 = 复用 src/KGRetrieve/config/storage.yaml 的 ChromaConfig
  # （OLLAMA_HOST / EMBEDDING_MODEL）；显式填写则覆盖。
  OLLAMA_HOST: ""
  EMBEDDING_MODEL: ""

  # —— 运行参数 —— #
  BATCH_SIZE: 16        # 每次请求提交的文本条数
  TIMEOUT_SECS: 120     # 单次 embedding 请求超时
