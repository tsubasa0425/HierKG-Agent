# config/pred.yaml
PredConfig:
  # —— I/O —— #
  DEDUP_NAME: "dedup_result.json"
  EMBEDDINGS_NAME: "node_embeddings.pkl"
  RESULT_NAME: "pred_result.json"

  # —— 候选召回 —— #
  MIN_SIM: 0.62              # 余弦相似度下限
  MIN_WEIGHT: 2              # 共现权重下限（与 MIN_SIM 二选一满足后再看 score）
  MIN_SCORE: 0.55            # 综合分 = 0.6*sim + 0.25*共现 + 0.15*共同小节
  MAX_PREDICTIONS_PER_NODE: 4
  MAX_TOTAL: 500

  # —— LLM 复核（只判 top 候选，控制成本）—— #
  LLM_PREDICT: true
  LLM_MAX_PAIRS: 80
  LLM_MIN_CONFIDENCE: 0.5
  DRY_RUN: false
  TEMPERATURE: 0.2
  MAX_TOKENS: 300
  PROMPT_VERSION: "pred.v2"

  # —— 提示词模板 —— #
  # 占位符：{name_a} {type_a} {layer_a} {desc_a}
  #         {name_b} {type_b} {layer_b} {desc_b}
  #         {sim} {shared} {weight} {allowed}
  PROMPT_SYSTEM: |
    你是教材知识图谱的关系编辑。只依据给出的两个实体及其定义判断一条最强关系。
    可用的关系类型由用户消息中的 allowed 列表限定，不得输出列表外的类型。
    如果证据不足，输出 type="none"，不要用 related 凑数。
    方向必须符合定义：applies_to 是「方法/工具 → 对象/任务」；
    part_of 是「子概念 → 上位概念」；instance_of 是「实例 → 概念」。

  PROMPT_USER_TEMPLATE: |
    实体 A：{name_a}
    类型：{type_a} / 层级：{layer_a}
    定义：{desc_a}

    实体 B：{name_b}
    类型：{type_b} / 层级：{layer_b}
    定义：{desc_b}

    结构信号：cos={sim}，共同小节={shared}，共现权重={weight}
    允许的关系：{allowed}

    输出严格 JSON（仅 JSON）：
    {
      "type": "allowed 中的一个，或 none",
      "confidence": 0.0,
      "description": "不超过 40 字的依据",
      "keywords": ["抽象关键词"]
    }
