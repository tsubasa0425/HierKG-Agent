# ============================================================
# HierKG L0 Ontology — Schema
# ------------------------------------------------------------
# 设计原则：
#   1. type 与 layer 正交：NodeTypes 只描述语义类别，层级由 LayerPolicy 判定
#   2. 层级由规则优先判定，模糊情况才调 LLM
#   3. RelationTypes 为闭集，规范名用 snake_case，显式声明方向 / 逆关系 / 端点约束
#   4. 同一 type 的节点可以落在不同 layer（例如「算法」既可能是 L1 概念，也可能是 L2 具体实例）
#   5. 关系只存一个方向，逆关系由序列化层派生，避免同一语义出现两条边
#   6. 所有阈值都是可调参数，不是本体的一部分
#
# 说明：数据形状、校验规则、ID 策略、构建清单与流水线阶段以代码为唯一事实源，
#       本文件只保留本体与分层策略，避免同一约定在两处维护。
# ============================================================

schema_version: "1.0"
ontology_name: "HierKG L0"
status: stable
updated_at: "2026-11-02"
description: >
  面向有结构文档（教材、技术手册等）的四层知识图谱本体。
  L0 只定义「节点类型、关系类型、层级判定策略与关系归一化」；
  具体领域词汇通过 domain_packs 扩展，核心本体保持稳定。

# ============================================================
# 1. 节点类型（只描述语义类别，不决定层级）
# ============================================================
NodeTypes:
  core:
    概念:
      description: 抽象术语、理论、范式、范畴；不指代具体实例
      examples: [强化学习, 先验知识, 效用函数, 世界模型]

    方法:
      description: 算法、技术手段、工程方法、流程
      examples: [提示工程, 思维链, 梯度下降, 感知-思考-行动循环]

    人工物:
      description: 人造的具体对象、系统、模型、产品、文档
      examples: [AlphaGo, BERT, GPT-4, 本书]

    工具:
      parent: 人工物
      description: 具体的软件工具、框架、库、平台
      examples: [LangChain, LlamaIndex, Cursor, Trae]

    人物:
      description: 具体的人
      examples: [马文·明斯基, 李工]

    组织:
      description: 机构、公司、团队
      examples: [OpenAI, 算法团队]

    指标:
      description: 评估指标、度量、评分标准
      examples: [准确率, 召回率, F1]

    属性:
      description: 参数、配置项、特征、属性
      examples: [temperature, top_k, max_tokens, 权重]

    任务:
      description: 目标、任务、应用场景
      examples: [路径规划, 文本分类, 多轮对话]

    事件:
      description: 有明确时空边界的事件、会议、发布
      examples: [AlphaGo 战胜李世石, 2023 年大模型发布潮]

    待定:
      description: 抽取时无法归类；进入待清洗池，不参与建图
      resolved: false

  domain_packs:
    ai_textbook:
      display_name: "AI / Agent 教材"
      description: 面向智能体、机器学习教材的领域扩展
      types:
        智能体类型:
          parent: 概念
          description: 智能体的分类范式
          examples: [反射智能体, 基于目标的智能体, 基于效用的智能体, 学习型智能体]

        学习方法:
          parent: 方法
          description: 学习范式 / 训练方式
          examples: [监督学习, 自监督学习, 强化学习机制]

        数学概念:
          parent: 概念
          description: 数学基础概念
          examples: [梯度, 损失函数, 概率分布]

        算法:
          parent: 方法
          description: 具体算法
          examples: [A* 算法, 反向传播, 蒙特卡洛树搜索]

        提示词:
          parent: 人工物
          description: 具体的提示词模板 / 提示词资产
          examples: [思维链提示模板, Few-shot 提示]

# ============================================================
# 2. 层级判定策略（layer 与 type 正交）
# ============================================================
LayerPolicy:
  description: >
    层级是节点在图中的角色，不是语义类型。L1 = 跨文档/跨章节复用的抽象节点；
    L2 = 具体实例、命名实体、具体配置值；L3 只用于证据，不参与本策略。
    规则按顺序匹配，命中即停；匹配到 llm 时才调用模型兜底。

  layers:
    L1: "抽象概念或方法；可跨章节复用，通常有定义性表述"
    L2: "具体实例、命名实体、具体配置值；通常只在少数章节出现"
    excluded: "待定或低显著性节点，不进入检索层"

  signals:
    cross_section_coverage: "节点出现的不同小节数"
    occurrence_count: "出现总次数"
    definitional_cue: "原文是否存在定义性措辞（是指 / 定义为 / 称为 / 是一种 / 指的是）"
    has_definition: "抽取阶段是否得到可用定义句（原文定义或证据化补全）"
    heading_presence: "是否出现在章 / 节 / 小节标题"
    proper_instance: "是否为专有实例（版本号、产品名、编号、具体配置值）"
    degree: "图谱中的度数"

  # 规则按顺序匹配，命中即停；调整顺序会直接改变分层结果。
  # 求值实现：schema_loader.py 的 _match() / Schema.evaluate_layer()。
  # 条件里可用的信号见上方 signals；比较操作支持 gte/gt/lte/lt/eq/in，
  # 组合操作支持 all（全部满足）/ any（任一满足），空条件 {} 恒为真。
  rules:
    # 条件：节点类型是「待定」（抽取阶段无法归类）。
    # 实际构建中 Aggr 会在规则求值之前就把待定节点硬判为 excluded，
    # 所以这条规则当前不会命中；保留它是为了声明「待定本应交 LLM 判定」的语义。
    - id: unresolved
      when: {type: 待定}
      layer: llm
      confidence: 0.5

    # 条件：信号 proper_instance == true，即名称命中版本号、产品名、工具、
    # 人物、组织、配置值等专有实例特征（检测逻辑见 Aggr.detect_proper_instance）。
    # 刻意排在复用规则之前：实例即使被反复提及，仍然属于 L2。
    - id: proper_instance
      when: {proper_instance: true}
      layer: L2
      confidence: 0.9

    # 条件：同时满足——
    #   definitional_cue == true     原文 name 附近存在定义性措辞
    #   cross_section_coverage >= 2  至少出现在 2 个不同小节
    # 语义：有明确定义且被跨节复用的教科书核心概念。
    - id: defined_and_reused
      when:
        all:
          - {definitional_cue: true}
          - {cross_section_coverage: {gte: 2}}
      layer: L1
      confidence: 0.95

    # 条件：同时满足——
    #   cross_section_coverage >= 2  至少出现在 2 个不同小节
    #   occurrence_count >= 2        全文至少出现 2 次
    # 语义：没有定义句，但跨节多次出现的公共词汇。
    - id: reused
      when:
        all:
          - {cross_section_coverage: {gte: 2}}
          - {occurrence_count: {gte: 2}}
      layer: L1
      confidence: 0.85

    # 条件：任一满足——
    #   heading_presence == true     名称出现在章/节/小节标题中
    #   definitional_cue == true     原文存在定义性措辞
    #   has_definition == true       抽取阶段得到了可用定义句
    # 语义：标题词或带定义说明的词；只出现一次也可能归 L1。
    - id: heading_or_definition
      when:
        any:
          - {heading_presence: true}
          - {definitional_cue: true}
          - {has_definition: true}
      layer: L1
      confidence: 0.8

    # 条件：空条件，恒为真——以上规则都未命中时的兜底。
    # 语义：信息不足，交 LLM 判定；LLM 不可用时由 Aggr 用启发式兜底（默认 L2）。
    - id: default
      when: {}
      layer: llm
      confidence: 0.5

  llm_fallback:
    enabled: true
    trigger: "rule.layer == 'llm'"
    prompt_ref: "aggr.yaml#PROMPTS.system"
    allowed_outputs: [L1, L2]
    confidence_default: 0.7

  drop_policy:
    enabled: true
    when: "layer == excluded or (type == 待定 and llm_failed)"
    action: "不进入 L1/L2，保留在待清洗池"

# ------------------------------------------------------------
# 2.1 信号检测器（建议实现，可替换但语义必须一致）
# ------------------------------------------------------------
SignalDetectors:
  definitional_cue:
    patterns: ["是指", "定义为", "称为", "是一种", "指的是", "所谓", "即"]
    window: "同一 block 内，name 前后 80 字"
    notes: "命中任一模式即视为有定义性表述"

  heading_presence:
    source: "TOC 节点的 title"
    match: "name 是 title 的子串，或与其别名相同"

  proper_instance:
    patterns:
      - "[A-Za-z][A-Za-z0-9_.-]{2,}"            # 英文专名 / 产品名
      - "v?\\d+(\\.\\d+)+"                       # 版本号
      - "第[一二三四五六七八九十0-9]+[章节条]"     # 编号
      - "[A-Z]{2,}[A-Za-z0-9-]*"                # 缩写
    notes: "命中任一模式视为专有实例；中文普通名词不应命中"

  cross_section_coverage:
    source: "occurrences[].section_id 去重计数"

  occurrence_count:
    source: "occurrences 长度"

  degree:
    source: "构建完成后统计的节点入度 + 出度"

# ============================================================
# 3. 关系类型（闭集）
# ------------------------------------------------------------
# direction: directed / symmetric
# inverse: 逆关系名；store_inverse=false 表示只在序列化时派生，不重复存边
# endpoint_policy: same_layer / cross_layer / layer_constraint / type_constraint
# ============================================================
RelationTypes:
  core:
    part_of:
      direction: directed
      inverse: has_part
      store_inverse: false
      endpoint_policy: same_layer
      layers: [L1-L1, L2-L2]
      description: A 是 B 的组成部分或子概念
      examples: ["感知-思考-行动循环 --part_of--> 智能体运行机制"]

    prerequisite:
      direction: directed
      inverse: null
      endpoint_policy: same_layer
      layers: [L1-L1, L2-L2]
      description: 掌握 A 是理解 B 的必要条件
      examples: ["梯度下降 --prerequisite--> 反向传播"]

    applies_to:
      direction: directed
      inverse: null
      endpoint_policy: same_layer
      layers: [L1-L1, L2-L2]
      description: A（方法 / 算法 / 工具）用于 B（对象 / 任务 / 场景）
      examples: ["提示工程 --applies_to--> 大语言模型"]

    example_of:
      direction: directed
      inverse: has_example
      store_inverse: false
      endpoint_policy: layer_constraint
      layers: [L2-L1]
      description: A 是 B 的实例或典型代表
      examples: ["AlphaGo --example_of--> 强化学习"]

    synonym:
      direction: symmetric
      endpoint_policy: same_layer
      layers: [L1-L1, L2-L2]
      description: 严格同义或别名

    contrasts_with:
      direction: symmetric
      endpoint_policy: same_layer
      layers: [L1-L1, L2-L2]
      description: 在用途、性质上形成对比

    related:
      direction: symmetric
      endpoint_policy: same_layer
      layers: [L1-L1, L2-L2]
      description: 相关但不满足更强语义（兜底）
      is_fallback: true
      min_confidence: 0.5

  cross_layer:
    instance_of:
      direction: directed
      inverse: null
      endpoint_policy: layer_constraint
      layers: [L2-L1]
      description: L2 实体归属某个 L1 概念
      examples: ["AlphaGo --instance_of--> 强化学习"]

    described_by:
      direction: directed
      inverse: null
      endpoint_policy: layer_constraint
      layers: [L1-L3]
      description: L1 概念由某条 L3 证据定义 / 解释（强引用）

    appears_in:
      direction: directed
      inverse: null
      endpoint_policy: layer_constraint
      layers: [L1-L3, L2-L3]
      description: 节点出现在某条 L3 证据中（弱引用）

  derived_inverses:
    has_part: {inverse_of: part_of}
    has_example: {inverse_of: example_of}

# ============================================================
# 4. 关系名归一化（只处理书写变体）
# ------------------------------------------------------------
# 调用点：所有产出或消费关系的阶段都会经过 Schema.canonical_relation()
#   Extraction → Conv → Aggr(_merge_relations) → Pred → FinalKG → 校验器
# 归一顺序（schema_loader.py::canonical_relation）：
#   1. 本身就是规范名 → 直接返回
#   2. 小写 + 连字符/空格转下划线 → 命中规范名则返回
#   3. 查本别名表 → 返回 canonical；仍未命中则视为未知关系并丢弃该边
# 第 2 步已经覆盖 part-of / part of / Part Of 等书写变体，
# 因此本表只登记机械归一后仍不是规范名的别名（related_to、synonym_of）。
# 新增别名前先确认第 2 步处理不了，避免重复条目。
# ============================================================
RelationAliases:
  related_to: {canonical: related}
  synonym_of: {canonical: synonym}

# ============================================================
# 5. 层级总览
# ============================================================
LayerModel:
  L0:
    name: 本体层
    content: 节点类型、关系类型、层级策略、关系归一化
    storage: schema.yaml
  L1:
    name: 概念层
    content: 跨文档/跨章节复用的抽象节点
    id_prefix: concept_
  L2:
    name: 实体层
    content: 具体实例、命名实体、具体配置
    id_prefix: ent_
  L3:
    name: 证据层
    content: 可定位的原文片段
    id_prefix: ev_

# ============================================================
# 6. 变更记录
# ============================================================
Changelog:
  - version: "1.0"
    date: "2026-11-02"
    changes:
      - "初始版本：type 与 layer 正交，LayerPolicy 规则优先"
      - "关系闭集，声明方向 / 逆关系 / 端点约束，逆关系序列化时派生"
      - "Evidence 支持 block 级与字符偏移，节点与边统一带 confidence / salience / provenance"
      - "数据契约、校验规则与流水线阶段由代码承载，schema 只保留本体与分层策略"
