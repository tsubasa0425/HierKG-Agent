# config/aggr.yaml
AggrConfig:
  # —— I/O —— #
  CONV_IN_NAME: "conv_entities.json"
  OUT_NAME: "aggr_entities.json"

  # —— 运行控制 —— #
  LIMIT: 0            # 0 = 不限制；>0 仅处理前 N 个实体（调试）
  WORKERS: 8
  DRY_RUN: false
  LLM_LAYER: true     # 规则未命中时是否允许调用 LLM 判层

  # —— LLM 调用参数（step 专属）—— #
  TEMPERATURE: 0.0
  MAX_TOKENS: 300
  PROMPT_VERSION: "aggr.v2"

  # —— 决策登记表 / 人工覆写 / 质量告警 —— #
  # 规则每次重新求值；只有 LLM 决策会在 policy/prompt/model 三项指纹一致时复用
  REGISTRY_ENABLED: true
  LAYER_REGISTRY_NAME: "layer_registry.json"
  LAYER_OVERRIDES_NAME: "layer_overrides.yaml"   # 相对 config/ 目录，进 git 可评审

  # 兜底率 = (LLM + 缓存 + 启发式) / (规则 + LLM + 缓存 + 启发式)，不含人工覆写
  FALLBACK_RATE_WARN: 0.15      # 超过只告警
  FALLBACK_RATE_FAIL: 0.35      # 配合 FAIL_ON_FALLBACK_RATE 使用
  FAIL_ON_FALLBACK_RATE: false  # 默认不阻断构建

  # —— 分层辅助 —— #
  # 这些类型天然是“具体实例”，直接归 L2（仍会写 layer_rule=proper_instance）
  PROPER_INSTANCE_TYPES: [工具, 人工物, 人物, 组织, 事件]

  # L2 → 父概念 的类型偏好（越靠前加分越多）
  PARENT_TYPE_PREFERENCE:
    工具: [人工物, 概念, 方法, 算法]
    人工物: [概念, 方法]
    人物: [概念, 组织, 事件]
    组织: [概念, 事件]
    事件: [概念, 方法]
    指标: [概念, 方法]
    属性: [概念, 方法]
    任务: [概念, 方法]
    算法: [数学概念, 方法, 概念]
    智能体类型: [概念, 方法]

  PARENT_MIN_SCORE: 1.0        # 低于该分数不硬凑父节点
  INSTANCE_OF_CONFIDENCE: 0.6  # 基础置信度，按证据强度上浮，封顶 0.9

  # —— 提示词（仅用于规则未命中的灰区）—— #
  # 占位符：{entity_name} {entity_type} {definition} {coverage} {occurrences} {neighbors}
  PROMPT_SYSTEM: |
    你是知识图谱分层编辑。L1 = 跨小节复用、可被定义的抽象节点；
    L2 = 具体实例、命名实体、具体配置值。
    只依据给出的统计信号与原文定义判断，不引入外部知识。

    判定顺序：
    1. 版本号、产品名、人名、机构名、具体配置值 → L2
    2. 在多个小节出现，且有定义句 / 是标题 → L1
    3. 只在一个小节出现、且只是被举例提到 → L2
    4. 信息不足时倾向 L2（宁可少抽象，不要造概念）

    只输出一行：L1 或 L2。

  PROMPT_USER_TEMPLATE: |
    实体：{entity_name}
    类型：{entity_type}
    定义：{definition}
    覆盖小节数：{coverage}
    出现次数：{occurrences}
    主要邻居：{neighbors}
